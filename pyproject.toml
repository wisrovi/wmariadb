[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wmariadb"
version = "1.0.0"
authors = [
    { name = "William Steve Rodriguez Villamizar", email = "wisrovi.rodriguez@gmail.com" },
]
description = "MariaDB ORM using Pydantic models - simple, type-safe database operations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database :: Database Engines/Servers",
]
dependencies = [
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "mariadb>=1.1.0",
    "aiomysql>=0.2.0",
]

[project.scripts]
wmariadb = "wmariadb.cli:main"

[project.urls]
Homepage = "https://github.com/wisrovi/wmariadb"
Documentation = "https://github.com/wisrovi/wmariadb#readme"
Repository = "https://github.com/wisrovi/wmariadb"
Issues = "https://github.com/wisrovi/wmariadb/issues"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["wmariadb"]
omit = ["*/tests/*", "*/test_*.py"]